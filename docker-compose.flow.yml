# WeaveSense-Flow P0 portable stack. Relative paths + named volumes only.
# Usage: cp .env.flow.example .env.flow && docker compose -f docker-compose.flow.yml --env-file .env.flow up -d
# P1: loom-engine/loom-scheduler run the Flow engine (services/loom-engine/flow/main.ts).
name: weavesense-flow
x-restart: &restart
  restart: unless-stopped
services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env.flow}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-flow_platform}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-flow_platform}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set in .env.flow}
      INTEL_DB_NAME: ${INTEL_DB_NAME:-flow_intel}
      INTEL_DB_USER: ${INTEL_DB_USER:-flow_intel}
      INTEL_DB_PASSWORD: ${INTEL_DB_PASSWORD:?set in .env.flow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/flow/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20
    networks: [internal]
  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in .env.flow}"]
    volumes: [redisdata:/data]
    networks: [internal]
  minio:
    <<: *restart
    # Upstream minio/minio images are no longer pullable from Docker Hub/quay;
    # override with FLOW_MINIO_IMAGE if you mirror your own.
    image: ${FLOW_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.flow}
    volumes: [objects:/data]
    networks: [internal]
  minio-init:
    image: ${FLOW_MC_IMAGE:-bitnamilegacy/minio-client:2025.7.21}
    user: "0:0"
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set flow http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb -p flow/${PLATFORM_BUCKET:-flow-platform} flow/${INTEL_BUCKET:-flow-intel};
        mc anonymous set none flow/${PLATFORM_BUCKET:-flow-platform}; mc anonymous set none flow/${INTEL_BUCKET:-flow-intel}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [internal]
  # Go platform: identity, authz, billing ledger, agent runs. Pi runtime is
  # bundled in this image (backend/Dockerfile stage pi-runtime-deps).
  platform:
    <<: *restart
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env.flow]
    environment:
      # Names below are the ones backend/cmd/server/main.go and internal/flow actually read.
      CANVAS_DATABASE_DRIVER: postgres
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      DATABASE_URL: postgres://${PLATFORM_DB_USER:-flow_platform}:${PLATFORM_DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-flow_platform}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOOM_ENGINE_URL: http://loom-engine:8080
      # P5 Model Gateway (OpenAI-compatible). Set FLOW_MODEL_GATEWAY_URL/_KEY/_MODEL in .env.flow; unset = extractive only.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: [platformdata:/data]
    networks:
      internal:
        aliases: [backend]   # nginx.conf proxies /api to http://backend:8080
  web:
    <<: *restart
    build: { context: ., dockerfile: Dockerfile }
    depends_on: [platform]
    ports: ["${FLOW_HTTP_PORT:-8088}:3000"]   # the only published entrypoint
    networks: [internal]
  # Loom Engine (extracted from WeaveSense): sources, cursors, documents, jobs.
  loom-engine:
    <<: *restart
    build: { context: ./services/loom-engine, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      DATABASE_URL: postgres://${INTEL_DB_USER:-flow_intel}:${INTEL_DB_PASSWORD}@postgres:5432/${INTEL_DB_NAME:-flow_intel}?sslmode=disable
      LOOM_ROLE: api            # internal API + collection worker + outbox dispatcher
      LOOM_PORT: "8080"
      FLOW_PLATFORM_EVENTS_URL: http://platform:8080/api/internal/flow/events
    command: ["node", "flow/main.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
  loom-scheduler:
    <<: *restart
    build: { context: ./services/loom-engine, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      DATABASE_URL: postgres://${INTEL_DB_USER:-flow_intel}:${INTEL_DB_PASSWORD}@postgres:5432/${INTEL_DB_NAME:-flow_intel}?sslmode=disable
      LOOM_ROLE: scheduler      # single due-window scanner (advisory-locked)
      # P5: re-check grant authorization + LLM brief summarization via the platform (internal network only).
      FLOW_PLATFORM_INTERNAL_URL: http://platform:8080
      LOOM_AUTO_MIGRATE: "false"
    command: ["node", "flow/main.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
  # Optional Telegram MTProto collector (A19). Enable with
  # `--profile telegram` and set TELEGRAM_WORKER_URL=http://telethon:8787 in .env.flow.
  telethon:
    <<: *restart
    profiles: [telegram]
    build: { context: ./services/loom-engine/workers/telethon, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${INTEL_BUCKET:-flow-intel}
    volumes: [telethondata:/data]
    networks: [internal]
networks:
  internal: {}
volumes:
  telethondata: {}
  pgdata: {}
  redisdata: {}
  objects: {}
  platformdata: {}
