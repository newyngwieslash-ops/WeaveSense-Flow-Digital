name: Agriculture signed service identity acceptance
on:
  workflow_dispatch:
  push:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
    paths:
      - '.github/workflows/agriculture-identity.yml'
      - 'scripts/agriculture/**'
      - 'backend/internal/agriculture/**'
      - 'backend/internal/agricanonical/**'
      - 'backend/go.*'
      - 'services/agri-gis/backend/**'
      - 'tests/agriculture/fixtures/identity-canonical.json'
      - 'deploy/agriculture/postgres/**'
  pull_request:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
permissions:
  contents: read
jobs:
  signed-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: scaffold
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Verify source preparation and fail-closed result gate
        run: |
          python3 scaffold/scripts/agriculture/session-ci-prepare.test.py
          python3 scaffold/scripts/agriculture/identity-ci-result.test.py
          python3 scaffold/scripts/agriculture/identity-chain-result.test.py
          python3 scaffold/tests/agriculture/test_identity_chain_configuration.py
          node --test scaffold/scripts/agriculture/identity-chain-browser.test.mjs
      - name: Assemble pinned upstreams and explicit reviewed overlay
        env:
          SCAFFOLD_MODE: ${{ github.ref_name == 'ci/agriculture-w00' || github.head_ref == 'ci/agriculture-w00' }}
        run: |
          set -euo pipefail
          mode=full
          if [[ "$SCAFFOLD_MODE" == true ]]; then mode=scaffold; fi
          python3 scaffold/scripts/agriculture/session-ci-prepare.py --scaffold scaffold --destination product --mode "$mode"
          echo "CANVAS_BUILD_COMMIT=$(python3 -c 'import json; print(json.load(open("product/.local/evidence/session-ci-provenance.json"))["source_commit"])')" >> "$GITHUB_ENV"
          echo "AGRI_E2E_SOURCE_COMMIT=$(python3 -c 'import json; print(json.load(open("product/.local/evidence/session-ci-provenance.json"))["source_commit"])')" >> "$GITHUB_ENV"
      - name: Rebuild hash-locked Python environment without lock changes
        working-directory: product
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$PWD/.local/cache/uv"
          mkdir -p .local/identity-rebuild
          python3 scripts/agriculture/export-python-lock.py --group main --output .local/identity-rebuild/main.txt
          python3 scripts/agriculture/export-python-lock.py --group dev --output .local/identity-rebuild/dev.txt
          uv venv --python python3.12 .local/identity-rebuild/venv
          uv pip install --python .local/identity-rebuild/venv/bin/python --require-hashes --no-deps --only-binary :all: --index-url https://pypi.org/simple \
            -r .local/identity-rebuild/main.txt -r .local/identity-rebuild/dev.txt -r scripts/agriculture/python-test-requirements.txt
          uv pip check --python .local/identity-rebuild/venv/bin/python
      - name: Build actual browser profiles for the signed write chain
        working-directory: product
        run: |
          set -euo pipefail
          go -C backend test ./internal/agriculture -run '^TestIdentityChain(ChildEnvironment|SafeDiagnostic)$' -count=1
          (cd web && bun install --frozen-lockfile --ignore-scripts && bun run build:agriculture)
          (cd services/agri-gis/frontend && npm ci --ignore-scripts --no-audit --no-fund && npm run build:agriculture)
      - name: Obtain runner nginx without starting a daemon
        working-directory: product
        run: |
          set -euo pipefail
          sudo apt-get update
          mkdir -p .local/chain-nginx/download .local/chain-nginx/root
          (cd .local/chain-nginx/download && apt-get download nginx nginx-common)
          for package in .local/chain-nginx/download/*.deb; do dpkg-deb -x "$package" .local/chain-nginx/root; done
          nginx="$PWD/.local/chain-nginx/root/usr/sbin/nginx"
          test -x "$nginx"
          "$nginx" -v
          echo "NGINX_BIN=$nginx" >> "$GITHUB_ENV"
          echo "NGINX_MIME_TYPES=$PWD/.local/chain-nginx/root/etc/nginx/mime.types" >> "$GITHUB_ENV"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          "$chrome" --version
          echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          records = [{'name': p.name, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'version': subprocess.check_output(['dpkg-deb', '-f', str(p), 'Version'], text=True).strip()} for p in sorted(pathlib.Path('.local/chain-nginx/download').glob('*.deb'))]
          pathlib.Path('.local/evidence/identity-chain-nginx.json').write_text(json.dumps({'source': 'Ubuntu runner official apt repositories', 'packages': records, 'same_version_as_docker_image': False}, indent=2) + '\n')
          PY
      - name: Actual signed HTTP and PostgreSQL replay acceptance
        working-directory: product
        env:
          AGRI_IDENTITY_CHAIN_REQUIRED: '1'
        run: |
          export AGRI_IDENTITY_PYTHON="$PWD/.local/identity-rebuild/venv/bin/python"
          bash scripts/agriculture/identity-postgres-ci.sh
      - name: Sanitized reports only
        if: always()
        run: |
          for file in product/.local/evidence/identity-*.json; do
            if [[ -f "$file" ]]; then cat "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agriculture-identity-sanitized-evidence
          path: |
            product/.local/evidence/identity-*.json
            product/.local/evidence/identity-*.xml
            product/.local/evidence/session-ci-provenance.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
