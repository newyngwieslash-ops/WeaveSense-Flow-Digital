name: Agriculture isolated parser container acceptance
on:
  workflow_dispatch:
  push:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
    paths:
      - '.github/workflows/agriculture-parser.yml'
      - 'scripts/agriculture/**'
      - 'deploy/agriculture/Dockerfile.parser'
      - 'services/agri-gis/backend/**'
  pull_request:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
permissions:
  contents: read
jobs:
  parser-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: scaffold
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
          enable-cache: false
      - name: Verify fail-closed source preparation and workflow wiring
        run: |
          python3 scaffold/scripts/agriculture/session-ci-prepare.test.py
          python3 scaffold/scripts/agriculture/parser-ci-wiring.test.py
          python3 scaffold/scripts/agriculture/parser-ci-result.test.py
      - name: Assemble pinned sources and explicitly reviewed overlay
        env:
          SCAFFOLD_MODE: ${{ github.ref_name == 'ci/agriculture-w00' || github.head_ref == 'ci/agriculture-w00' }}
        run: |
          set -euo pipefail
          mode=full
          if [[ "$SCAFFOLD_MODE" == true ]]; then mode=scaffold; fi
          python3 scaffold/scripts/agriculture/session-ci-prepare.py --scaffold scaffold --destination product --mode "$mode"
          python3 - <<'PY'
          import json, os, pathlib, re
          source = json.loads(pathlib.Path('product/.local/evidence/session-ci-provenance.json').read_text())['source_commit']
          if not isinstance(source, str) or re.fullmatch('[0-9a-f]{40}', source) is None:
              raise SystemExit('invalid source provenance')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'AGRI_E2E_SOURCE_COMMIT={source}\n')
          PY
      - name: Rebuild hash-locked Python environment without lock changes
        working-directory: product
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$PWD/.local/cache/uv"
          mkdir -p .local/identity-rebuild
          python3 scripts/agriculture/export-python-lock.py --group main --output .local/identity-rebuild/main.txt
          python3 scripts/agriculture/export-python-lock.py --group dev --output .local/identity-rebuild/dev.txt
          uv venv --python python3.12 .local/identity-rebuild/venv
          uv pip install --python .local/identity-rebuild/venv/bin/python --require-hashes --no-deps --only-binary :all: --index-url https://pypi.org/simple \
            -r .local/identity-rebuild/main.txt -r .local/identity-rebuild/dev.txt -r scripts/agriculture/python-test-requirements.txt
          uv pip check --python .local/identity-rebuild/venv/bin/python
      - name: Actual isolated Docker parser acceptance
        working-directory: product
        run: |
          set -euo pipefail
          export AGRI_IDENTITY_PYTHON="$PWD/.local/identity-rebuild/venv/bin/python"
          bash scripts/agriculture/parser-docker-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agriculture-parser-sanitized-evidence
          path: |
            product/.local/evidence/parser-docker.json
            product/.local/evidence/session-ci-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
