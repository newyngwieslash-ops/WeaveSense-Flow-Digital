name: Agriculture real browser session
on:
  workflow_dispatch:
  push:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
    paths:
      - '.github/workflows/agriculture-session.yml'
      - 'scripts/agriculture/session-*'
      - 'web/**'
      - 'services/agri-gis/frontend/**'
      - 'backend/internal/auth/**'
      - 'backend/internal/handler/**'
      - 'docs/agriculture/profile/licenses/**'
  pull_request:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
permissions:
  contents: read
jobs:
  browser-session:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: scaffold
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Test safe source preparation and assemble disposable product
        env:
          SCAFFOLD_MODE: ${{ github.ref_name == 'ci/agriculture-w00' || github.head_ref == 'ci/agriculture-w00' }}
        run: |
          set -euo pipefail
          python3 scaffold/scripts/agriculture/session-ci-prepare.test.py
          mode=full
          if [[ "$SCAFFOLD_MODE" == true ]]; then mode=scaffold; fi
          python3 scaffold/scripts/agriculture/session-ci-prepare.py --scaffold scaffold --destination product --mode "$mode"
          echo "AGRI_E2E_SOURCE_COMMIT=$(python3 -c 'import json; print(json.load(open("product/.local/evidence/session-ci-provenance.json"))["source_commit"])')" >> "$GITHUB_ENV"
      - name: Compile actual Go authentication server
        working-directory: product
        run: |
          set -euo pipefail
          mkdir -p .local/bin
          go -C backend build -o "$PWD/.local/bin/agriculture-platform" ./cmd/server
      - name: Build and test actual React production profile
        working-directory: product/web
        env:
          CANVAS_BUILD_COMMIT: ${{ env.AGRI_E2E_SOURCE_COMMIT }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test test/agriculture-profile.test.ts test/auth-return-path.test.ts test/auth-session-race.test.ts
          bun run build:agriculture
      - name: Build and test actual Vue production profile
        working-directory: product/services/agri-gis/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          bun run test:agriculture
          npm run build:agriculture
      - name: Actual Chromium same-origin session lifecycle
        working-directory: product
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$chrome"
          export CHROME_BIN="$chrome"
          node --test scripts/agriculture/session-e2e.test.mjs
          node scripts/agriculture/session-e2e.mjs
      - name: Sanitized result only
        if: always()
        run: |
          for file in product/.local/evidence/session-browser-e2e.json product/.local/evidence/session-ci-provenance.json; do
            if [[ -f "$file" ]]; then cat "$file"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agriculture-session-sanitized-evidence
          path: |
            product/.local/evidence/session-browser-e2e.json
            product/.local/evidence/session-ci-provenance.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
