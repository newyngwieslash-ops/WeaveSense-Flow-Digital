name: One-time verified agricultural history import
on:
  push:
    branches: [import/agriculture-full-20261102]
    paths: ['.github/workflows/import-agriculture-full.yml', 'import-bundle/**']
permissions:
  contents: write
concurrency:
  group: agriculture-full-history-import
  cancel-in-progress: false
jobs:
  import-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: import-scaffold
      - name: Verify exact bundle and import without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: newyngwieslash-ops/WeaveSense-Flow-Digital
          EXPECTED_BASE: 206c82af7ae007f45da4c582f373fbabf027f1b8
          EXPECTED_TARGET: 192c40517cdf02930a7fdb9fbe8d82c8cd25c00d
          EXPECTED_TREE: 53ff103a9c60b69ec424d8a546f1107709e012c0
          EXPECTED_BUNDLE_SHA256: 117547800b24a5cce8a202ad68fb2c992a19f659b866aa4271965a06754a2caf
          EXPECTED_BUNDLE_REF: refs/heads/delivery-handoff-20261102
          EXPECTED_COMMIT_COUNT: '2177'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('import-scaffold/import-bundle')
          m = json.loads((root / 'manifest.json').read_text())
          assert m['target'] == os.environ['EXPECTED_TARGET']
          assert m['tree'] == os.environ['EXPECTED_TREE']
          assert m['base'] == os.environ['EXPECTED_BASE']
          assert m['sha256'] == os.environ['EXPECTED_BUNDLE_SHA256']
          assert m['bundle_ref'] == os.environ['EXPECTED_BUNDLE_REF']
          assert m['commit_count'] == int(os.environ['EXPECTED_COMMIT_COUNT'])
          h = hashlib.sha256()
          total = 0
          with open('history.bundle', 'wb') as out:
              for index, part in enumerate(m['parts']):
                  assert part['path'] == f'part-{index:03d}.bin'
                  p = root / part['path']
                  assert p.is_file() and not p.is_symlink()
                  data = p.read_bytes()
                  assert len(data) == part['size']
                  assert hashlib.sha256(data).hexdigest() == part['sha256']
                  total += len(data)
                  h.update(data)
                  out.write(data)
          assert total == m['size']
          assert h.hexdigest() == m['sha256']
          Path('evidence/bundle-verified.json').write_text(json.dumps(m, indent=2) + '\n')
          PY
          repo_url="https://github.com/$EXPECTED_REPOSITORY.git"
          target_ref=refs/heads/feat/agriculture-v1
          current="$(git ls-remote "$repo_url" "$target_ref" | cut -f1)"
          test "$current" = "$EXPECTED_BASE"
          git init --quiet product
          git -C product remote add origin "$repo_url"
          git -C product -c core.hooksPath=/dev/null fetch --no-tags origin "$target_ref"
          test "$(git -C product rev-parse FETCH_HEAD)" = "$EXPECTED_BASE"
          git -C product bundle verify "$GITHUB_WORKSPACE/history.bundle"
          python3 - <<'PY'
          import os, subprocess
          heads = subprocess.check_output(['git', 'bundle', 'list-heads', 'history.bundle'], text=True).splitlines()
          assert len(heads) == 1
          assert heads[0].split() == [os.environ['EXPECTED_TARGET'], os.environ['EXPECTED_BUNDLE_REF']]
          PY
          git -C product -c core.hooksPath=/dev/null fetch "$GITHUB_WORKSPACE/history.bundle" "$EXPECTED_BUNDLE_REF"
          test "$(git -C product rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET"
          test "$(git -C product rev-parse "$EXPECTED_TARGET^{tree}")" = "$EXPECTED_TREE"
          test "$(git -C product rev-list --count "$EXPECTED_TARGET")" = "$EXPECTED_COMMIT_COUNT"
          test "$(git -C product rev-parse --is-shallow-repository)" = false
          git -C product merge-base --is-ancestor "$EXPECTED_BASE" "$EXPECTED_TARGET"
          git -C product fsck --connectivity-only --no-dangling
          current="$(git ls-remote "$repo_url" "$target_ref" | cut -f1)"
          test "$current" = "$EXPECTED_BASE"
          trap 'rm -f "$RUNNER_TEMP/agriculture-import-askpass.sh" "$RUNNER_TEMP/agriculture-import-hooks/pre-push"' EXIT
          mkdir -p "$RUNNER_TEMP/agriculture-import-hooks"
          cat > "$RUNNER_TEMP/agriculture-import-hooks/pre-push" <<'SH'
          #!/bin/sh
          set -eu
          count=0
          while read -r local_ref local_sha remote_ref remote_sha; do
            count=$((count + 1))
            test "$local_sha" = "$EXPECTED_TARGET"
            test "$remote_ref" = refs/heads/feat/agriculture-v1
            test "$remote_sha" = "$EXPECTED_BASE"
          done
          test "$count" = 1
          SH
          chmod 700 "$RUNNER_TEMP/agriculture-import-hooks/pre-push"
          cat > "$RUNNER_TEMP/agriculture-import-askpass.sh" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/agriculture-import-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/agriculture-import-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          git -C product -c credential.helper= -c core.hooksPath="$RUNNER_TEMP/agriculture-import-hooks" push --porcelain --atomic origin "$EXPECTED_TARGET:$target_ref"
          unset GIT_ASKPASS
          rm "$RUNNER_TEMP/agriculture-import-askpass.sh"
          actual="$(git ls-remote "$repo_url" "$target_ref" | cut -f1)"
          test "$actual" = "$EXPECTED_TARGET"
          git init --quiet verified-remote
          git -C verified-remote -c core.hooksPath=/dev/null fetch --no-tags "$repo_url" "$target_ref"
          test "$(git -C verified-remote rev-parse FETCH_HEAD)" = "$EXPECTED_TARGET"
          test "$(git -C verified-remote rev-parse "FETCH_HEAD^{tree}")" = "$EXPECTED_TREE"
          test "$(git -C verified-remote rev-list --count FETCH_HEAD)" = "$EXPECTED_COMMIT_COUNT"
          test "$(git -C verified-remote rev-parse --is-shallow-repository)" = false
          git -C verified-remote fsck --connectivity-only --no-dangling
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('evidence/import-result.json').write_text(json.dumps({
              'repository': os.environ['EXPECTED_REPOSITORY'],
              'branch': 'feat/agriculture-v1', 'base': os.environ['EXPECTED_BASE'],
              'target': os.environ['EXPECTED_TARGET'], 'tree': os.environ['EXPECTED_TREE'],
              'full_history': True, 'nonforce_push': True, 'main_changed': False,
              'production_deployed': False
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agriculture-full-history-import-evidence
          path: evidence/*.json
          if-no-files-found: warn
          retention-days: 14
