name: Agriculture W00 dependency evidence
on:
  workflow_dispatch:
  push:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
    paths:
      - '.github/workflows/agriculture-w00.yml'
      - 'scripts/agriculture/**'
      - 'deploy/agriculture/**'
      - 'docker-compose.agriculture.yml'
      - 'contracts/agriculture/**'
      - 'tests/agriculture/**'
      - 'backend/internal/database/**'
      - 'backend/cmd/server/**'
      - 'services/loom-engine/flow/**'
      - 'services/loom-engine/Dockerfile'
  pull_request:
    branches: [ci/agriculture-w00, feat/agriculture-v1]
    paths:
      - '.github/workflows/agriculture-w00.yml'
      - 'scripts/agriculture/**'
      - 'deploy/agriculture/**'
      - 'docker-compose.agriculture.yml'
      - 'contracts/agriculture/**'
      - 'tests/agriculture/**'
      - 'backend/internal/database/**'
      - 'backend/cmd/server/**'
      - 'services/loom-engine/flow/**'
      - 'services/loom-engine/Dockerfile'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install isolated schema-test dependencies
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install pytest==8.3.5 jsonschema==4.26.0 referencing==0.37.0 jsonschema-specifications==2025.9.1 rpds-py==2026.6.3 PyYAML==6.0.3
      - name: Contract negatives and trusted source policy
        run: |
          .ci-venv/bin/python -m pytest -q tests/agriculture/test_contracts.py tests/agriculture/test_source_rights.py tests/agriculture/test_compose_policy.py tests/agriculture/test_ci_smoke_environment.py tests/agriculture/test_geo_worker_role_policy.py tests/agriculture/test_w00_source_assembly.py
          .ci-venv/bin/python scripts/agriculture/session-ci-prepare.test.py
          .ci-venv/bin/python scripts/agriculture/check-source-policy.py --profile agriculture
  compose:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [core, migrations]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: scaffold
          persist-credentials: false
      - name: Explicit scaffold bootstrap or existing full product checkout
        shell: bash
        env:
          SCAFFOLD_MODE: ${{ github.ref_name == 'ci/agriculture-w00' || github.head_ref == 'ci/agriculture-w00' }}
        run: |
          set -euo pipefail
          mode=full
          if [[ "$SCAFFOLD_MODE" == true ]]; then mode=scaffold; fi
          # Share the reviewed source closure with the other acceptance jobs.
          # Missing migration code fails closed instead of running old upstream.
          python3 scaffold/scripts/agriculture/session-ci-prepare.py --scaffold scaffold --destination product --mode "$mode"
          printf '%s\n' 'Source: recorded in session-ci-provenance.json; scaffold mode is not a source-history publication.' >> "$GITHUB_STEP_SUMMARY"
      - name: Fresh-volume database and migration smoke
        working-directory: product
        shell: bash
        env:
          SMOKE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          bash scripts/agriculture/ci-smoke.sh "$SMOKE_MODE"
          printf 'PASS: W00 %s Docker smoke. No tenant/business/live acceptance claimed.\n' "$SMOKE_MODE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agriculture-w00-${{ matrix.mode }}-source-evidence
          path: product/.local/evidence/session-ci-provenance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
