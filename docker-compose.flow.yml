# WeaveSense-Flow P0 portable stack. Relative paths + named volumes only.
# Usage: cp .env.flow.example .env.flow && docker compose -f docker-compose.flow.yml --env-file .env.flow up -d
# P1: loom-engine/loom-scheduler run the Flow engine (services/loom-engine/flow/main.ts).
# PRD §14 profiles: core (postgres, redis, minio, platform, web, loom-engine, loom-scheduler; enabled by
# COMPOSE_PROFILES=core in .env.flow, or pass --profile core), plus the optional
# telegram, wechat, subtitles, extract (OCR + attachment retry), asr (speech-to-text, with extract), research (briefs),
# monitoring (Prometheus + alert rules), backup (daily DB + object backups with retention). With extract/research set LOOM_SPLIT_ROLES=true in .env.flow
# so api/scheduler hand those loops to the dedicated containers.
name: weavesense-flow
x-restart: &restart
  restart: unless-stopped
services:
  postgres:
    profiles: [core]
    <<: *restart
    image: postgres:17-alpine   # PG17 everywhere (CI, deploy compose); 16→17 upgrade: docs/flow/release-deploy.md
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env.flow}
      PLATFORM_DB_NAME: ${PLATFORM_DB_NAME:-flow_platform}
      PLATFORM_DB_USER: ${PLATFORM_DB_USER:-flow_platform}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:?set in .env.flow}
      INTEL_DB_NAME: ${INTEL_DB_NAME:-flow_intel}
      INTEL_DB_USER: ${INTEL_DB_USER:-flow_intel}
      INTEL_DB_PASSWORD: ${INTEL_DB_PASSWORD:?set in .env.flow}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/flow/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 20
    networks: [internal]
  redis:
    profiles: [core]
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set in .env.flow}"]
    volumes: [redisdata:/data]
    networks: [internal]
  minio:
    profiles: [core]
    <<: *restart
    # Upstream minio/minio images are no longer pullable from Docker Hub/quay;
    # override with FLOW_MINIO_IMAGE if you mirror your own.
    image: ${FLOW_MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    user: "0:0"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.flow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.flow}
    volumes: [objects:/data]
    networks: [internal]
  minio-init:
    profiles: [core]
    image: ${FLOW_MC_IMAGE:-bitnamilegacy/minio-client:2025.7.21}
    user: "0:0"
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until mc alias set flow http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb -p flow/${PLATFORM_BUCKET:-flow-platform} flow/${INTEL_BUCKET:-flow-intel};
        mc anonymous set none flow/${PLATFORM_BUCKET:-flow-platform}; mc anonymous set none flow/${INTEL_BUCKET:-flow-intel}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [internal]
  # Go platform: identity, authz, billing ledger, agent runs. Pi runtime is
  # bundled in this image (backend/Dockerfile stage pi-runtime-deps).
  platform:
    profiles: [core]
    <<: *restart
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: [.env.flow]
    environment:
      # Names below are the ones backend/cmd/server/main.go and internal/flow actually read.
      CANVAS_DATABASE_DRIVER: postgres
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      DATABASE_URL: postgres://${PLATFORM_DB_USER:-flow_platform}:${PLATFORM_DB_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-flow_platform}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      LOOM_ENGINE_URL: http://loom-engine:8080
      # P5 Model Gateway (OpenAI-compatible). Set FLOW_MODEL_GATEWAY_URL/_KEY/_MODEL in .env.flow; unset = extractive only.
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: [platformdata:/data]
    networks:
      internal:
        aliases: [backend]   # nginx.conf proxies /api to http://backend:8080
  web:
    profiles: [core]
    <<: *restart
    build: { context: ., dockerfile: Dockerfile }
    depends_on: [platform]
    ports: ["${FLOW_HTTP_PORT:-8088}:3000"]   # the only published entrypoint
    networks: [internal]
  # Loom Engine (extracted from WeaveSense): sources, cursors, documents, jobs.
  loom-engine:
    profiles: [core]
    <<: *restart
    build: { context: ./services/loom-engine, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      DATABASE_URL: postgres://${INTEL_DB_USER:-flow_intel}:${INTEL_DB_PASSWORD}@postgres:5432/${INTEL_DB_NAME:-flow_intel}?sslmode=disable
      LOOM_ROLE: api            # internal API + collection worker + outbox dispatcher
      LOOM_PORT: "8080"
      FLOW_PLATFORM_EVENTS_URL: http://platform:8080/api/internal/flow/events
    command: ["node", "flow/main.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
  loom-scheduler:
    profiles: [core]
    <<: *restart
    build: { context: ./services/loom-engine, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      DATABASE_URL: postgres://${INTEL_DB_USER:-flow_intel}:${INTEL_DB_PASSWORD}@postgres:5432/${INTEL_DB_NAME:-flow_intel}?sslmode=disable
      LOOM_ROLE: scheduler      # single due-window scanner (advisory-locked)
      # P5: re-check grant authorization + LLM brief summarization via the platform (internal network only).
      FLOW_PLATFORM_INTERNAL_URL: http://platform:8080
      LOOM_AUTO_MIGRATE: "false"
    command: ["node", "flow/main.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
  # Optional Telegram MTProto collector (A19). Enable with
  # `--profile telegram` and set TELEGRAM_WORKER_URL=http://telethon:8787 in .env.flow.
  telethon:
    <<: *restart
    profiles: [telegram]
    build: { context: ./services/loom-engine/workers/telethon, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${INTEL_BUCKET:-flow-intel}
    volumes: [telethondata:/data]
    networks: [internal]
  # Optional YouTube subtitle enrichment (loom-upstream cdcb787f, POST /v1/documents/transcript).
  # Enable with `--profile subtitles`, SUBTITLE_ENABLED=true and two different random tokens
  # (SUBTITLE_SERVICE_TOKEN, SUBTITLE_PROXY_TOKEN, 24-128 chars [A-Za-z0-9_-]) in .env.flow.
  # The worker sits on an isolated network with no route out; all its traffic goes through
  # the authenticated egress proxy, which is the only subtitle container loom-engine can reach.
  subtitle-worker:
    <<: *restart
    profiles: [subtitles]
    build: { context: ./services/loom-engine/workers/subtitle, dockerfile: Dockerfile }
    environment:
      SUBTITLE_ROLE: worker
      SUBTITLE_SERVICE_TOKEN: ${SUBTITLE_SERVICE_TOKEN:-}
      SUBTITLE_PROXY_TOKEN: ${SUBTITLE_PROXY_TOKEN:-}
    networks: [subtitle-internal]
    dns: ["127.0.0.1"]
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000"]
  subtitle-egress:
    <<: *restart
    profiles: [subtitles]
    build: { context: ./services/loom-engine/workers/subtitle, dockerfile: Dockerfile }
    environment:
      SUBTITLE_ROLE: egress
      SUBTITLE_SERVICE_TOKEN: ${SUBTITLE_SERVICE_TOKEN:-}
      SUBTITLE_PROXY_TOKEN: ${SUBTITLE_PROXY_TOKEN:-}
    networks: [internal, subtitle-internal]
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000"]
  # WeChat official-account gateway (primary feed + optional paid provider). Enable with
  # `--profile wechat`; set WECHAT_GATEWAY_URL=http://wechat-gateway:8790, WECHAT_GATEWAY_TOKEN
  # and WECHAT_PRIMARY_ALLOWED_HOSTS in .env.flow. A19 live acceptance is done by the user.
  wechat-gateway:
    <<: *restart
    profiles: [wechat]
    build: { context: ./services/loom-engine, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      PORT: "8790"
      GATEWAY_DB_PATH: /data/gateway.db
    command: ["node", "workers/wechat-gateway/server.mjs"]
    volumes: [wechatdata:/data]
    networks: [internal]
  # OCR worker + attachment-retry/OCR loop (§6.4). `--profile extract`, OCR_ENABLED=true,
  # OCR_SERVICE_TOKEN in .env.flow.
  ocr-worker:
    <<: *restart
    profiles: [extract]
    build: { context: ./services/loom-engine/workers/ocr, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${INTEL_BUCKET:-flow-intel}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    networks: [internal]
  # ASR worker (§6.4 audio/video → transcript, local faster-whisper, no egress). `--profile asr`
  # together with `--profile extract`; ASR_ENABLED=true and ASR_SERVICE_TOKEN in .env.flow.
  asr-worker:
    <<: *restart
    profiles: [asr]
    build: { context: ./services/loom-engine/workers/asr, dockerfile: Dockerfile, args: { ASR_MODEL: "${ASR_MODEL:-small}" } }
    env_file: [.env.flow]
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: ${INTEL_BUCKET:-flow-intel}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    networks: [internal]
  loom-enrich:
    <<: *restart
    profiles: [extract]
    build: { context: ./services/loom-engine, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      DATABASE_URL: postgres://${INTEL_DB_USER:-flow_intel}:${INTEL_DB_PASSWORD}@postgres:5432/${INTEL_DB_NAME:-flow_intel}?sslmode=disable
      LOOM_ROLE: enrich
      LOOM_AUTO_MIGRATE: "false"
      OCR_URL: http://ocr-worker:8796
      ASR_URL: http://asr-worker:8797
    command: ["node", "flow/main.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
  # Periodic brief/research generation split from the scheduler. `--profile research`.
  loom-research:
    <<: *restart
    profiles: [research]
    build: { context: ./services/loom-engine, dockerfile: Dockerfile }
    env_file: [.env.flow]
    environment:
      DATABASE_URL: postgres://${INTEL_DB_USER:-flow_intel}:${INTEL_DB_PASSWORD}@postgres:5432/${INTEL_DB_NAME:-flow_intel}?sslmode=disable
      LOOM_ROLE: research
      LOOM_AUTO_MIGRATE: "false"
      FLOW_PLATFORM_INTERNAL_URL: http://platform:8080
    command: ["node", "flow/main.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
  # Monitoring (§14): Prometheus scrapes loom-engine /metrics and platform /metrics/flow
  # (FLOW_METRICS_TOKEN). Rules: deploy/flow/monitoring/alerts.yml. Bound to localhost only.
  prometheus:
    <<: *restart
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./deploy/flow/monitoring:/etc/prometheus:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${FLOW_PROMETHEUS_PORT:-9090}:9090"]
    networks: [internal]
  # Daily backup (§14): both databases (dump + manifest + sha256) at BACKUP_AT UTC with
  # retention BACKUP_RETENTION_DAYS (keeps ≥ BACKUP_KEEP_MIN). Restore drills: docs/flow/release-deploy.md.
  flow-backup:
    <<: *restart
    profiles: [backup]
    image: postgres:17-alpine
    depends_on: [postgres]
    entrypoint: ["/bin/bash", "/b/daily.sh"]
    environment:
      BACKUP_DATABASE_URLS: >-
        platform=postgres://${POSTGRES_SUPERUSER:-postgres}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/${PLATFORM_DB_NAME:-flow_platform}
        intel=postgres://${POSTGRES_SUPERUSER:-postgres}:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/${INTEL_DB_NAME:-flow_intel}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
    volumes:
      - ./deploy/flow/backup:/b:ro
      - ${BACKUP_HOST_DIR:-backups}:/backups
    networks: [internal]
  # Daily object-store snapshot (object manifest + mirror) with the same retention.
  flow-backup-objects:
    <<: *restart
    profiles: [backup]
    image: ${FLOW_MC_IMAGE:-bitnamilegacy/minio-client:2025.7.21}
    user: "0:0"
    depends_on: [minio]
    entrypoint: ["/bin/bash", "/b/daily.sh"]
    environment:
      BACKUP_OBJECT_BUCKETS: ${PLATFORM_BUCKET:-flow-platform} ${INTEL_BUCKET:-flow-intel}
      MINIO_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BACKUP_AT: ${BACKUP_AT:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
    volumes:
      - ./deploy/flow/backup:/b:ro
      - ${BACKUP_HOST_DIR:-backups}:/backups
    networks: [internal]
networks:
  internal: {}
  subtitle-internal:
    internal: true
volumes:
  backups: {}
  telethondata: {}
  wechatdata: {}
  promdata: {}
  pgdata: {}
  redisdata: {}
  objects: {}
  platformdata: {}
